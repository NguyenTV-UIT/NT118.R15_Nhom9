# Nginx reverse proxy: Internet (port 80) -> Node.js (127.0.0.1:__APP_PORT__)
# setup-server.sh tự thay __APP_PORT__ và copy file này vào /etc/nginx/sites-available/

upstream dating_api {
    server 127.0.0.1:__APP_PORT__;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;               # chưa có domain -> nhận mọi request tới IP

    client_max_body_size 10m;    # upload ảnh (app giới hạn 5MB/ảnh)

    access_log /var/log/nginx/dating-app.access.log;
    error_log  /var/log/nginx/dating-app.error.log;

    location / {
        proxy_pass http://dating_api;
        proxy_http_version 1.1;

        # Cho WebSocket (chat realtime, WebRTC signaling ở giai đoạn sau)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;     # giữ kết nối WebSocket
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
